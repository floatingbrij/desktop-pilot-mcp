<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: transparent; }
  .icon { width: 512px; height: 512px; }
</style>
</head>
<body>
<svg class="icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1035"/>
      <stop offset="50%" style="stop-color:#0f0a1e"/>
      <stop offset="100%" style="stop-color:#0a0618"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="94" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>

  <!-- Background glow -->
  <circle cx="256" cy="220" r="180" fill="url(#glow)"/>

  <!-- Windows logo (stylized) -->
  <g transform="translate(256, 195)" filter="shadow">
    <!-- Top-left pane -->
    <rect x="-82" y="-82" width="74" height="74" rx="6" fill="url(#accent)" opacity="0.95"/>
    <!-- Top-right pane -->
    <rect x="8" y="-82" width="74" height="74" rx="6" fill="url(#accent)" opacity="0.8"/>
    <!-- Bottom-left pane -->
    <rect x="-82" y="8" width="74" height="74" rx="6" fill="url(#accent)" opacity="0.8"/>
    <!-- Bottom-right pane -->
    <rect x="8" y="8" width="74" height="74" rx="6" fill="url(#accent)" opacity="0.65"/>
  </g>

  <!-- Cursor/pointer overlay (representing automation) -->
  <g transform="translate(310, 250)">
    <path d="M0 0 L0 36 L10 28 L18 42 L24 38 L16 24 L28 22 Z" 
          fill="url(#cyan)" filter="shadow" opacity="0.95"/>
  </g>

  <!-- Connection dots (representing MCP protocol) -->
  <circle cx="150" cy="330" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="180" cy="345" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="332" cy="330" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="362" cy="345" r="4" fill="#6366f1" opacity="0.6"/>
  
  <!-- Connecting line hints -->
  <line x1="150" y1="330" x2="180" y2="345" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="332" y1="330" x2="362" y2="345" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <!-- "WinApp MCP" text -->
  <text x="256" y="420" text-anchor="middle" font-family="'Segoe UI', 'Inter', sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">
    WinApp
  </text>
  <text x="256" y="465" text-anchor="middle" font-family="'Segoe UI', 'Inter', sans-serif" font-size="36" font-weight="600" fill="url(#cyan)" letter-spacing="6" opacity="0.9">
    MCP
  </text>
</svg>
</body>
</html>
