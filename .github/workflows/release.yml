name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build MCP Server (self-contained)
        run: |
          cd src
          dotnet publish -c Release -r win-x64 --self-contained -o ../publish

      - name: Copy server binaries to extension
        run: |
          Remove-Item -Recurse -Force vscode-winapp-mcp/server -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path vscode-winapp-mcp/server -Force
          Copy-Item -Recurse -Force publish/* vscode-winapp-mcp/server/

      - name: Build VS Code Extension
        run: |
          cd vscode-winapp-mcp
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies

      - name: Get version
        id: version
        run: |
          $ver = (Get-Content vscode-winapp-mcp/package.json | ConvertFrom-Json).version
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WinApp MCP v${{ steps.version.outputs.VERSION }}
          body: |
            ## WinApp MCP v${{ steps.version.outputs.VERSION }}

            ### Install

            **npm (Claude, Cursor, Windsurf, any MCP client):**
            ```bash
            npx -y winapp-mcp
            ```

            **VS Code Marketplace:**
            Search "WinApp MCP" in Extensions, or `ext install BrijesharunG.winapp-mcp`

            **VSIX (manual):**
            1. Download `winapp-mcp-${{ steps.version.outputs.VERSION }}.vsix` below
            2. In VS Code: `Ctrl+Shift+P` → **Extensions: Install from VSIX...**

            See [CHANGELOG.md](https://github.com/floatingbrij/desktop-pilot-mcp/blob/main/CHANGELOG.md) for what's new.
          files: |
            vscode-winapp-mcp/*.vsix
          draft: false
          prerelease: false

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd vscode-winapp-mcp
          npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }} --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Prepare npm package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node scripts/prepare-server.js

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: winapp-mcp-vsix
          path: vscode-winapp-mcp/*.vsix
